context:
  version: "0.3.0"

package:
  name: spaday-blueprint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-blueprint/spaday_blueprint-${{ version }}.tar.gz
  sha256: 3ef35726a6bf7aa9708a22b3b153eb6e88811b16e56436f5b4fa1f46274feedd

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.10.0,<1

tests:
  - python:
      imports:
        - spaday_blueprint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: BlueprintUI components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-blueprint
  repository: https://github.com/1kbgz/spaday-blueprint

extra:
  recipe-maintainers:
    - timkpaine
