context:
  version: "0.3.1"

package:
  name: spaday-blueprint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-blueprint/spaday_blueprint-${{ version }}.tar.gz
  sha256: f67933ae06196550f6bbce2d079346bc6d4b537fee85b0b1469cbf6d9dd2db39

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.11.1,<1.0

tests:
  - python:
      imports:
        - spaday_blueprint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: BlueprintUI components and browser assets for spaday
  homepage: https://github.com/1kbgz/spaday-blueprint
  repository: https://github.com/1kbgz/spaday-blueprint

extra:
  recipe-maintainers:
    - timkpaine
